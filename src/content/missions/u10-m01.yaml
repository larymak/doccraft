      A multi-phase documentation crisis. Work through each phase to reduce
      knowledge debt, preserve Marcus's expertise, and set Priya up for success.
    xpReward: 500
    masteryThreshold: 75
    debtReduction: 20
    hints:
      - level: 1
        text: Start by reading Marcus's exit notes carefully. Make a list of everything that needs a document.
      - level: 2
        text: Prioritize by risk. What would cause an incident if Marcus were unreachable today?
      - level: 3
        text: Each phase builds on the last. Your SOP informs the AI-readiness checklist. Your ADR updates the onboarding path.
    data:
      scenario: >
        Marcus leaves Monday. Priya starts Tuesday. The knowledge base is in crisis.
        You have one day to fix what matters most.
      briefing: >
        You have reviewed Marcus's exit notes and the existing documentation.
        Work through each phase in order. At the end, the AI feedback system will
        evaluate your complete set of deliverables.
      masteryRequirement: 75
