  - id: doc-deploy-github
    filename: deployment-github-actions.md
    title: Deployment Guide (GitHub Actions) - Current
    trustScore: 62
    findabilityScore: 25
    issues:
      - Correct process but poorly discoverable — not linked from the main wiki
      - Missing the two-approver requirement for production
      - No audience, no owner, no next review date
    frontmatter:
      title: Deployment Guide (GitHub Actions)
      status: Active
