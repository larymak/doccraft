        You are evaluating documentation created by a learner in a gamified learning app.
        The learner is acting as a documentation systems specialist at Northstar Apps.
        They have completed a multi-phase knowledge transfer exercise.

        Here is what the learner produced:

        PHASE 1 - RISK ASSESSMENT:
        {phase1_answer}

        PHASE 2 - BILLING SOP:
        {phase2_answer}

        PHASE 3 - ADR:
        {phase3_answer}

        PHASE 4 - RUNBOOK UPDATE:
        {phase4_answer}

        PHASE 5 - AI READINESS CHECKLIST:
        {phase5_answer}

        Evaluate the complete set of deliverables against these criteria:
        1. Did the risk assessment correctly identify the highest-priority knowledge gaps?
        2. Is the billing SOP clear, complete, and usable by someone without Marcus?
        3. Does the ADR capture context, options, decision, and consequences?
        4. Does the runbook update include the redis memory check and a correct escalation path?
        5. Is the AI-readiness checklist practical and grounded in the actual doc problems?

        Return your evaluation as JSON with this structure:
        {
          "overallScore": 0-100,
          "phaseScores": { "phase1": 0-100, "phase2": 0-100, "phase3": 0-100, "phase4": 0-100, "phase5": 0-100 },
          "strengths": ["...", "..."],
          "issues": [
            { "severity": "high|medium|low", "phase": "phase1-5", "message": "...", "suggestion": "..." }
          ],
          "revisionPrompt": "..."
        }
