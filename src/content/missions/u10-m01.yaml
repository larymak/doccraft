id: u10-m01
unitId: unit-10
order: 1
slug: u10-m01
title: "The Expert Leaves Tomorrow"
scenario: >
  It is Friday at Northstar Apps. Marcus, the senior platform engineer who has
  been at the company since day one, is leaving for a new role on Monday.
  A new backend engineer, Priya, starts next week. Billing reconciliation has
  no current SOP. Deployment docs contradict each other. Several important ADRs
  are missing. Search results surface outdated docs. Last week's incident
  revealed gaps in the runbook. Leadership wants an AI assistant ready to
  answer process questions, but the knowledge base is not ready for it.
  You have one day. Go.
objectives:
  - Identify the top 5 critical knowledge risks before Marcus leaves
  - Write or fix a billing reconciliation SOP with full metadata
  - Write an ADR from fragmented decision context
  - Fix search for the most-used deployment docs
  - Create a 30-day onboarding path for Priya
  - Update the incident runbook based on last week's incident
  - Prepare an AI-readiness checklist for the knowledge base
materials:
  - id: doc-marcus-notes
    filename: marcus-handoff-notes.md
    title: Marcus Exit Notes (Draft)
    trustScore: 12
    findabilityScore: 8
    issues:
      - Not a real document type — personal notes, not a structured handoff
      - Mix of process hints, system quirks, and random context
      - No audience, no owner, no dates
      - Will be worthless in 3 months without structured capture
    frontmatter: {}
    body: |
      # Marcus Exit Notes

      Things I know that probably aren't written down:

      billing reconciliation:
      - runs every month-end, usually around the 28th
      - script is at /billing/scripts/reconcile.py
      - needs BILLING_DB_URL and STRIPE_SECRET_KEY env vars from 1password vault "production"
      - has to be run in this order: stripe pull, then local db compare, then generate report
      - the $0.50 rounding rule — don't flag discrepancies under 50 cents, finance approved this
      - sometimes fails silently if Stripe rate limits us — check the logs at /var/log/billing/reconcile.log
      - i fixed a double-count bug in march 2026, the fix is in commit a4f82b

      deployments:
      - we have THREE deployment docs and they contradict each other
      - the real process is: merge to main → GH Actions runs tests → auto-deploys staging → manual approval for production
      - the old heroku one is wrong, the confluence one is wrong, only the github wiki one is right
      - production approvals need TWO engineers, not one (changed after the march incident)

      architecture:
      - we chose postgres over mongo for billing events in 2024 — decision doc never got written
      - the reason was ACID compliance for financial data + our existing postgres expertise
      - considered: mongo (rejected: no ACID), mysql (rejected: team expertise), dynamodb (rejected: cost + complexity)

      runbook gaps:
      - last week's checkout latency incident — we didn't know to check redis memory first
      - the fix was: redis-cli info memory → if used_memory > 80% → run redis-cli flushdb (after confirming with lead)
      - this should be in the runbook but isn't

      ai assistant prep:
      - don't let it use the heroku deployment doc or the old billing notes
      - the refund SOP v3 is probably fine but needs the escalation path added
      - any doc with status Draft should be excluded from the AI index
