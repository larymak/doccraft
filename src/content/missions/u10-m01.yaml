      last_reviewed: "2026-03-01"
    body: |
      # Deployment Guide — GitHub Actions

      ## Process

      1. Merge your PR to the main branch
      2. GitHub Actions will automatically run the test suite
      3. If tests pass, staging deployment starts automatically
      4. Verify staging at https://staging.northstar-apps.com
      5. Go to the GitHub Actions workflow run
      6. Click "Approve Production Deploy" (requires engineer approval)
      7. Production deployment takes ~8 minutes

      Owner: Platform Engineering
      Last reviewed: March 2026
  - id: doc-incident-runbook
    filename: runbook-checkout-latency.md
    title: Runbook - Checkout Latency
    trustScore: 48
    findabilityScore: 52
    issues:
      - Missing the redis memory check step discovered in the April incident
      - No post-incident update process documented
      - Escalation path is incomplete — only lists one engineer
    frontmatter:
      title: Runbook - Checkout Latency
      doc_type: Runbook
      status: Active
      owner: Platform Engineering
      last_reviewed: "2026-03-15"
    body: |
      # Runbook - Checkout Latency

      **Audience:** On-call platform engineers
      **Owner:** Platform Engineering

      ## Symptoms

      - P95 checkout latency > 2 seconds
      - Checkout error rate > 0.5%
      - Customer complaints about slow checkout

      ## Initial Diagnosis

      1. Check Datadog latency dashboard
      2. Check application logs for errors
      3. Check database connection pool utilization
      4. Check external payment processor status (Stripe status page)

      ## Resolution Steps

      **If DB connection pool is exhausted:**
      - Restart the application pods: `kubectl rollout restart deployment/checkout`

      **If Stripe is degraded:**
      - Enable the "graceful degradation" feature flag
      - Notify the support team

      ## Escalation

      If unresolved in 30 minutes, page @marcus
