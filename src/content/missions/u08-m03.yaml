id: u08-m03
unitId: unit-08
order: 3
slug: u08-m03
title: "Handle Overdue Document Reviews"
scenario: >
  Three Northstar Apps documents have passed their next_review date and are now
  flagged as overdue in the docs health dashboard. The engineering manager wants
  each one triaged before the end of the week. For each document you must decide:
  update it (the content is mostly right and worth fixing), archive it (the content
  is obsolete and should be retired), or escalate it (the content is high-risk and
  needs a subject-matter expert before you can decide). Each decision carries
  different follow-up actions.
objectives:
  - Read overdue documents and assess whether they are worth updating, archiving, or escalating
  - Apply the correct triage action with an appropriate rationale
  - Understand when a documentation decision needs to be escalated to an SME
  - Write a triage note that documents your decision and its reasoning
