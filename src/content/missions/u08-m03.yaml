    body: |
      # Slack Integration Setup Guide

      ## Prerequisites

      You will need a Slack workspace admin account and your Northstar API key.

      ## Create a Slack App

      1. Go to https://api.slack.com/apps and click **Create New App**.
      2. Choose **From scratch** and name your app.
      3. Under **OAuth & Permissions**, add the bot token scopes: `channels:read`,
         `chat:write`, `users:read`.

      ## Install and Authorize (Legacy Flow)

      4. Click **Install to Workspace**.
      5. Copy the **OAuth Access Token** (starts with `xoxp-`).
      6. In the Northstar dashboard, go to **Settings > Integrations > Slack**
         and paste the `xoxp-` token.

      _Note: The xoxp- token type was used in the 2023 Northstar integration.
      Contact integrations@northstarapps.com for the new setup flow._
