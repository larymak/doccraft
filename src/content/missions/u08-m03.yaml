    body: |
      # Local Development with Vagrant

      Northstar Apps uses Vagrant to provide a consistent local development
      environment. The Vagrantfile is maintained by the platform team.

      ## Prerequisites

      - VirtualBox 6.1+
      - Vagrant 2.3+

      ## Setup

      ```bash
      vagrant up
      vagrant ssh
      cd /var/www/platform
      npm install
      npm run dev
      ```

      The local stack will be available at http://192.168.56.10:3000.
