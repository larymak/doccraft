estimatedMinutes: 20
prerequisiteMissionId: u08-m02
assessments:
  - id: u08-m03-a1
    type: sorting
    title: Triage the Overdue Documents
    description: >
      Sort each overdue document into the correct triage action: update, archive, or escalate.
    xpReward: 70
    masteryThreshold: 100
    debtReduction: 6
    hints:
      - level: 1
        text: >
          Archive when the content describes something that no longer exists.
          Update when the content is mostly right but needs corrections.
          Escalate when the risk is too high to decide without an SME.
      - level: 2
        text: >
          Legal and compliance documents should almost always be escalated to the
          legal or compliance team before changes are made — not updated by engineers alone.
    data:
      instruction: >
        For each overdue document, choose the correct triage action.
      categories:
        - id: update
          label: Update
          description: Content is mostly accurate and worth fixing; assign to an owner and correct the specific issues
        - id: archive
          label: Archive
          description: Content is obsolete — the technology, process, or feature no longer exists; retire the document
        - id: escalate
          label: Escalate
          description: High-risk content that cannot be updated safely without subject-matter expert review
      items:
        - id: i1
          text: "Slack Integration Setup — references legacy OAuth flow that was deprecated; new hires are getting blocked"
          categoryId: update
          explanation: >
            The guide is valuable and the integration still exists — only the OAuth flow
            changed. Update the guide to the current token type (xoxp- → xoxb- bot tokens),
            assign a new owner from the integrations team, and reset the review date.
        - id: i2
          text: "Local Development with Vagrant — Vagrant was replaced by Docker 2 years ago; no one uses Vagrant"
          categoryId: archive
          explanation: >
            Vagrant is no longer used at Northstar Apps. Keeping this document "active"
            actively harms new hires who find it and follow instructions that no longer work.
            Archive it with a note pointing to the current Docker setup guide.
        - id: i3
          text: "PCI DSS Compliance Checklist — references an outdated standard version; compliance risk if wrong"
          categoryId: escalate
          explanation: >
            PCI DSS compliance documentation has legal and financial risk. An engineer
            cannot safely update this document without a legal review. Escalate to the
            legal/compliance team and the payments team security lead.
  - id: u08-m03-a2
    type: writing
    title: Write Triage Notes for All Three Documents
    description: >
      Write a short triage note for each document explaining your decision and
      what the next owner needs to do. These notes go into the docs health dashboard
      and will be read by the docs team lead and document owners.
    xpReward: 110
    masteryThreshold: 70
    debtReduction: 9
    hints:
      - level: 1
        text: >
          Each triage note should state: (1) the triage action (update/archive/escalate),
          (2) the specific reason, and (3) the next action and who should do it.
      - level: 2
        text: >
          For the escalation note, name the specific person or team to escalate to
          and explain what question they need to answer before the doc can be updated.
    data:
      scenarioContext: >
        Write a triage note for each of the three overdue documents. Your notes will
        be logged in the docs health dashboard and assigned to the relevant team.
      docTemplate: |
        ## Triage Notes — Overdue Review Queue

        **Reviewed by:** [Your name / role]
        **Date:** 2026-05-04

        ---

        ### slack-integration-setup.md

        **Triage decision:** [Update / Archive / Escalate]

        **Reason:** [Why you made this decision]

        **Next action:** [Who does what by when]

        ---

        ### vagrant-dev-setup.md

        **Triage decision:** [Update / Archive / Escalate]

        **Reason:** [Why you made this decision]

        **Next action:** [Who does what by when]

        ---

        ### pci-dss-compliance-checklist.md

        **Triage decision:** [Update / Archive / Escalate]

        **Reason:** [Why you made this decision]

        **Next action:** [Who should be escalated to and what they need to decide]
      wordCountMin: 180
      acceptedPatterns:
        - update
        - archive
        - escalate
        - legal
        - OAuth
        - Vagrant
        - Docker
        - PCI
        - owner
      rubric:
        - id: r1
          label: Correct triage decision stated for all three documents
          description: Each note clearly states the triage decision (update, archive, or escalate)
          weight: 30
        - id: r2
          label: Specific rationale for each decision
          description: Each note explains why that action is the right one for this document
          weight: 35
        - id: r3
          label: Actionable next step with owner named
          description: Each note specifies what happens next and who is responsible for it
          weight: 35
