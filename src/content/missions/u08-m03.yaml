      # PCI DSS Compliance Checklist

      This checklist tracks Northstar Apps compliance with PCI DSS v3.2.1.

      ## Requirement 1 — Install and Maintain Network Security Controls

      - [x] Firewall rules documented and reviewed quarterly
      - [x] Network segmentation in place for cardholder data environment

      ## Requirement 6 — Develop and Maintain Secure Systems and Software

      - [x] Vulnerability scanning monthly
      - [ ] Penetration test completed in the last 12 months — due June 2026

      _Last external audit: October 2025. Next scheduled audit: October 2026._
