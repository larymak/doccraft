assessments:
  - id: u03-m03-a1
    type: sorting
    title: Remove the Scope Creep
    description: Sort each section or excerpt into whether it belongs in the SOP or should be moved elsewhere.
    xpReward: 90
    masteryThreshold: 75
    debtReduction: 8
    hints:
      - level: 1
        text: An SOP contains exactly one thing — the steps for performing a specific task. Anything that is not a step, a prerequisite, or a direct warning for that task does not belong.
      - level: 2
        text: Ask yourself — does the support specialist need this information to complete the task right now, or is it background knowledge they might want to read later?
    data:
      instruction: >
        Sort each excerpt into where it belongs. Keep what the support specialist
        needs to complete the task. Move everything else to its correct home.
      categories:
        - id: keep-sop
          label: Keep in SOP
          description: Directly needed to perform the task correctly
        - id: move-policy
          label: Move to Policy Document
          description: Rules, legal obligations, and organizational standards
        - id: move-explanation
          label: Move to Explanation Doc
          description: Conceptual background on how something works
        - id: move-runbook-ref
          label: Move to Runbook or Reference Doc
          description: Escalation paths, on-call details, engineering recovery steps
      items:
        - id: i1
          text: "Steps 1–9: Open account, locate transaction, verify window, upload evidence, write rebuttal, select reason code, check amount, submit"
          categoryId: keep-sop
          explanation: The numbered task steps are the core of the SOP. Everything else exists to support these or belongs elsewhere.
        - id: i2
          text: "\"Our payment processor charges a $15 fee per dispute regardless of outcome. The technical process involves our billing service calling the dispute API endpoint with the evidence payload.\""
          categoryId: move-explanation
          explanation: How the payment processor works technically is background knowledge, not task-execution knowledge. It belongs in an explanation or architecture doc.
        - id: i3
          text: "\"Northstar Apps does not accept liability for chargebacks resulting from customer error. All dispute responses become part of the permanent record and may be used in regulatory proceedings.\""
          categoryId: move-policy
          explanation: Liability statements and legal obligations belong in a formal policy document, not an SOP. The SOP should link to the policy, not reproduce it.
        - id: i4
          text: "\"If the amount exceeds $1,000, stop and get VP Finance approval before submitting\""
          categoryId: keep-sop
          explanation: >
            This is a conditional step that the support specialist must follow during task execution.
            It is task-critical and belongs as a warning or conditional step in the SOP itself.
        - id: i5
          text: "\"Post in #billing-eng with the transaction ID and error code. Page the on-call engineer via PagerDuty (billing-eng schedule). On-call rotation: billing-eng rotates weekly.\""
          categoryId: move-runbook-ref
          explanation: Escalation paths, Slack channels, on-call schedules, and PagerDuty details belong in a runbook or reference doc. The SOP can say "see the Billing Escalation Runbook" in a single line.
        - id: i6
          text: "\"Verify the dispute is within the 7-day response window\""
          categoryId: keep-sop
          explanation: >
            This is step 3 — a prerequisite check that must happen during task execution. It is
            task-critical and belongs in the SOP steps.
        - id: i7
          text: "\"Disputes must be tracked in the Billing Disputes Tracker spreadsheet maintained by Finance.\""
          categoryId: move-policy
          explanation: Record-keeping obligations are policy requirements. They may be referenced as a post-task step but the detail belongs in the policy document.
  - id: u03-m03-a2
    type: multiple-choice
    title: Why Scope Creep Hurts Under Pressure
    description: What is the primary risk of leaving out-of-scope content in an SOP?
    xpReward: 45
    masteryThreshold: 100
    debtReduction: 4
    hints:
      - level: 1
        text: Think about what a support specialist does when they are on a customer call with a time limit.
    data:
      question: >
        A support specialist is handling an angry customer whose refund was denied.
        They open the Billing Dispute SOP but have to read 400 words of background
        and legal policy before reaching the actual steps. What is the primary risk?
      options:
        - id: a
          text: The specialist might misunderstand the legal policy.
          isCorrect: false
          explanation: >
            Misunderstanding is possible, but legal comprehension is not the task at hand.
            The specialist is trying to perform a time-sensitive task, not study policy.
        - id: b
          text: >
            The specialist may skip or skim the steps under time pressure, missing the
            $1,000 approval requirement that is buried in the middle of the page.
          isCorrect: true
          explanation: >
            Correct. When people are under pressure, they scan. Burying a critical conditional
            step (VP Finance approval) inside 400 words of preamble means it will be missed.
            Scope creep is not just a readability problem — it is a compliance risk.
        - id: c
          text: The specialist will not be able to find the document in search.
          isCorrect: false
          explanation: >
            The document is findable (findabilityScore 55). The problem is not discovery —
            it is usability under time pressure.
        - id: d
          text: The specialist will get confused about who owns the document.
          isCorrect: false
          explanation: >
            Ownership is visible in the frontmatter. The problem is operational: a bloated SOP
            causes critical steps to be missed during execution.
