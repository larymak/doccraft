id: u03-m03
unitId: unit-03
order: 3
slug: u03-m03
title: Cut the Scope Creep
scenario: >
  The support team's "Handle a Billing Dispute" SOP has grown to 1,100 words over two
  years as different team members added sections whenever they thought of something related.
  It now contains policy explanations, engineering escalation paths, a link to the legal
  team's chargeback policy PDF, and a section on how the payment processor works internally.
  New specialists are overwhelmed. Your job is to identify everything that does NOT belong
  in a task-oriented SOP and flag it for removal or relocation.
objectives:
  - Distinguish between task content (what belongs in an SOP) and non-task content (what belongs elsewhere)
  - Identify the correct destination for each piece of out-of-scope content
  - Explain why scope creep makes SOPs harder to follow under pressure
materials:
  - id: doc-billing-dispute-sop
    filename: sop-billing-dispute.md
    title: SOP — Billing Dispute Handling — Support
    trustScore: 30
    findabilityScore: 55
    issues:
      - Contains conceptual explanation of payment processor mechanics — belongs in an explanation doc
      - Contains the full text of the legal chargeback policy — belongs in a policy doc
      - Contains engineering escalation paths with Slack channel names and on-call rotation details — belongs in a runbook or reference doc
      - Steps are buried in the middle of the document after 400 words of context
      - No scope statement telling readers what this SOP does and does not cover
    frontmatter:
      title: SOP — Billing Dispute Handling — Support
      status: Active
      owner: Sarah Chen
      audience: Support Specialists
      last_reviewed: "2026-01-10"
    body: |
      # SOP — Billing Dispute Handling — Support

      ## Background

      When a customer disputes a charge, their bank initiates a chargeback process with
      Visa, Mastercard, or Stripe depending on the payment method. The payment processor
      temporarily reverses the funds while the dispute is under review. This is an
      automated process on the processor's side. Northstar Apps receives a chargeback
      notice via webhook, which triggers an alert in Billing Dashboard. Our payment
      processor charges a $15 fee per dispute regardless of outcome. Disputes older than
      120 days cannot be responded to. The technical process involves our billing service
      calling the dispute API endpoint with the evidence payload. The response is signed
      with our API key and logged in the audit trail. Our processor SLA for dispute
      outcomes is 45–75 business days.

      ## Legal Policy

      Per the Northstar Apps Chargeback and Dispute Policy (Legal, updated March 2026):
      Northstar Apps will respond to all chargebacks within 7 calendar days. Disputes
      involving amounts over $1,000 require VP Finance approval before response submission.
      Northstar Apps does not accept liability for chargebacks resulting from customer
      error. All dispute responses become part of the permanent record and may be used
      in regulatory proceedings. Disputes must be tracked in the Billing Disputes
      Tracker spreadsheet maintained by Finance. See the full policy document at:
      legal/chargeback-policy-v4.pdf

      ## How to Respond to a Billing Dispute

      1. Open the customer account in Billing Dashboard
      2. Locate the disputed transaction — status must show "Awaiting Response"
      3. Verify the dispute is within the 7-day response window
      4. Click "Dispute" > "Respond to Chargeback"
      5. Upload evidence: order confirmation, delivery proof, communication log
      6. Write a 2–3 sentence rebuttal in the text field
      7. Select the dispute reason code
      8. If the amount exceeds $1,000, stop and get VP Finance approval before submitting
      9. Click Submit

      ## Engineering Escalation

      If Billing Dashboard is unavailable or the dispute submission fails:
      - Primary: Post in #billing-eng with the transaction ID and error code
      - Secondary: Page the on-call engineer via PagerDuty (billing-eng schedule)
      - Escalation SLA: 4 hours during business hours, 2 hours for P1 issues
      - If unresolved after 4 hours: escalate to Platform Engineering Lead
      - For database-level issues: post in #platform-oncall with severity P1 or P2
      - On-call rotation: billing-eng rotates weekly, platform rotates bi-weekly

      ## Related Reading

      - How Stripe handles chargebacks (external): stripe.com/docs/disputes
      - Northstar payment architecture overview (Engineering wiki)
      - Q1 2026 Dispute Volume Report (Finance)
