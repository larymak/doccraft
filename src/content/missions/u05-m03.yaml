  - id: u05-m03-a2
    type: multiple-choice
    title: When Authorship and Audience Conflict
    description: If an engineer writes an SOP that support specialists use, where does it go?
    xpReward: 45
    masteryThreshold: 100
    debtReduction: 4
    hints:
      - level: 1
        text: Think about which person opens their wiki and needs to find this document on any given workday.
    data:
      question: >
        A platform engineer writes an SOP for processing API credential rotations.
        The actual steps are performed by support specialists using the admin dashboard.
        The engineer wrote it and knows the process best. Where should this document be filed?
      options:
        - id: a
          text: "Engineering > Platform, because a platform engineer wrote it."
          isCorrect: false
          explanation: >
            Authorship does not determine the folder. The author is not the primary reader.
            Filing by author means documents get scattered across team folders based on who
            happened to write them, not who needs to find them.
        - id: b
          text: "Support > SOPs, because support specialists are the ones who perform the task and need to find it."
          isCorrect: true
          explanation: >
            Correct. Folder placement follows the primary reader — the person who will open their
            wiki looking for this document on a normal workday. Support specialists execute this
            task, so they need to find it in their part of the wiki. The engineer can keep a link
            to it from Engineering > Platform if needed.
        - id: c
          text: "Both Engineering > Platform and Support > SOPs, by creating a copy in each location."
          isCorrect: false
          explanation: >
            Copies create conflicting documentation. When the SOP is updated, both copies must be
            updated simultaneously. This is how wikis end up with two contradictory versions of the
            same document. Use a single canonical location and link to it from other locations.
        - id: d
          text: "Company > Policies, because credential rotation is a company-wide concern."
          isCorrect: false
          explanation: >
            Credential rotation is an operational task, not a company policy. Policies describe
            rules and obligations. SOPs describe how to execute a specific process.
