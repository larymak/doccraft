id: u05-m03
unitId: unit-05
order: 3
slug: u05-m03
title: Find the Misplaced Documents
scenario: >
  After the folder reorganization, the Northstar Apps wiki looks better — but someone
  did a bulk import from the old Confluence instance and dropped 14 documents into
  whatever folder seemed close enough. A postmortem ended up in Support > SOPs.
  An onboarding guide ended up in Engineering > ADRs. Your job is to review each
  misplaced document and identify which folder it actually belongs in.
objectives:
  - Determine the correct folder for a document based on its content, type, and audience
  - Identify the specific reason each document was misplaced
  - Distinguish between documents that look similar but belong in different locations
materials:
  - id: doc-misplaced-sample
    filename: incident-2025-11-03-rate-limiter.md
    title: Rate Limiter Incident — November 2025
    trustScore: 55
    findabilityScore: 15
    issues:
      - Currently filed in Support > SOPs — wrong audience and wrong document type
      - Contains postmortem content (timeline, root cause, action items)
      - Should be in Engineering > Postmortems
    frontmatter:
      title: Rate Limiter Incident — November 2025
      status: Active
      owner: Platform Engineering
      last_reviewed: "2025-12-01"
    body: |
      # Rate Limiter Incident — November 2025

      **Date:** November 3, 2025
      **Duration:** 22 minutes
      **Affected:** API clients on all tiers

      ## Timeline

      11:14 — Datadog alert: rate limiter queue depth exceeded 5,000
      11:18 — On-call engineer identified Redis memory saturation as probable cause
      11:29 — Redis memory cleared via maintenance script
      11:36 — Queue depth returned to normal

      ## Root Cause

      Redis memory saturation caused rate limit counters to be evicted, allowing
      requests that exceeded per-client limits to pass through unchecked.

      ## Action Items

      - [ ] Add Redis memory alert at 70% threshold
      - [ ] Update rate limiter runbook with Redis saturation scenario
