    body: |
      # SOP — Refund Processing — Engineering Reference

      ## Overview

      Refunds are processed via the Stripe API using the POST /v1/refunds endpoint.
      Each refund request must include a unique idempotency key to prevent duplicate
      processing in the event of network failure or retry. The billing service validates
      the refund against the original payment intent ID before issuing.

      ## Prerequisites

      - Stripe API key with write permissions (stored in AWS Secrets Manager: prod/stripe/secret-key)
      - Payment intent ID from the Postgres billing_transactions table
      - Idempotency key (generate via UUID v4)

      ## Steps

      1. Retrieve the payment intent ID from billing_transactions WHERE order_id = [order_id]
      2. Generate an idempotency key: uuidgen | tr '[:upper:]' '[:lower:]'
      3. Call POST /v1/refunds with: payment_intent, amount (in cents), reason, metadata.ticket_id
      4. Confirm HTTP 200 response with refund object containing status: "succeeded"
      5. Update billing_transactions SET refund_status = 'completed', refund_id = [stripe_refund_id]
      6. Trigger the email notification lambda: aws lambda invoke --function-name billing-notifications

      ## Validation

      Verify in Datadog: billing.refund.created event should appear within 30 seconds.
      Check billing_audit_log for the refund entry with the correct ticket_id in metadata.

      ## Rollback

      If the refund was issued in error, call POST /v1/refunds/[refund_id]/cancel within
      5 minutes. After 5 minutes, contact the customer and issue a correcting charge.
