    findabilityDelta: 15
    hints:
      - level: 1
        text: "Start by rewriting the Prerequisites section. What does a support specialist actually need before they start? (Hint: it is not an API key.)"
      - level: 2
        text: Every step in your SOP should describe a UI action — clicking a button, selecting a dropdown, entering a value in a field.
      - level: 3
        text: "Replace the Validation section with an Expected Outcome section. What does the support specialist SEE in Billing Dashboard when the refund succeeds?"
    data:
      scenarioContext: >
        The engineering refund SOP is accurate but unusable by support specialists.
