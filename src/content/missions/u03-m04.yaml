    title: Rewrite the Refund SOP for Support Specialists
    description: >
      Rewrite the refund processing SOP so a support specialist can follow it
      using only the Billing Dashboard. No API calls, no database queries, no
      command-line steps. Keep the same process logic but in the right language
      for the right audience.
    xpReward: 150
    masteryThreshold: 75
    debtReduction: 12
