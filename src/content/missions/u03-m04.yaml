assessments:
  - id: u03-m04-a1
    type: sorting
    title: What Makes This Engineering-Only?
    description: Sort each element into whether it belongs in a support specialist SOP or should stay in the engineering version.
    xpReward: 80
    masteryThreshold: 75
    debtReduction: 7
    hints:
      - level: 1
        text: Support specialists use the Billing Dashboard UI. They do not have database access, API keys, or command-line tools.
      - level: 2
        text: The support version of each step describes what to click in the UI, not what happens in the underlying system.
    data:
      instruction: >
        Sort each element from the engineering SOP into its correct destination.
      categories:
        - id: support-version
          label: Needs a Support Specialist Version
          description: This concept exists for support but must be rewritten in UI terms
        - id: engineering-only
          label: Engineering-Only — Remove from Support SOP
          description: Support specialists don't need or can't access this at all
        - id: keep-both
          label: Keep in Both Versions
          description: This information applies to both audiences with the same wording
      items:
        - id: i1
          text: "\"Retrieve the payment intent ID from billing_transactions WHERE order_id = [order_id]\""
          categoryId: engineering-only
          explanation: Support specialists do not have database access. The Billing Dashboard shows the order ID directly in the UI.
        - id: i2
          text: "\"Generate an idempotency key: uuidgen | tr '[:upper:]' '[:lower:]'\""
          categoryId: engineering-only
          explanation: The Billing Dashboard handles idempotency automatically. Support specialists never generate keys.
        - id: i3
          text: "The concept of locating the specific transaction by order ID"
          categoryId: support-version
          explanation: Support specialists do locate transactions by order ID — but they do it by typing the ID into the Billing Dashboard search field, not querying a database.
        - id: i4
          text: "The concept of confirming the refund succeeded"
          categoryId: support-version
          explanation: Both audiences need to confirm success — but engineers check Datadog and billing_audit_log, while support specialists see the transaction status change in Billing Dashboard.
        - id: i5
          text: "\"Refunds over $500 require manager approval before submission\""
          categoryId: keep-both
          explanation: This is a business rule that applies regardless of who is processing the refund. Both versions need this warning with the same wording.
        - id: i6
          text: "\"Trigger the email notification lambda: aws lambda invoke --function-name billing-notifications\""
          categoryId: engineering-only
          explanation: Support specialists do not invoke Lambda functions. The Billing Dashboard sends the confirmation email automatically when they click Submit.
        - id: i7
          text: "The concept of cancelling a refund issued in error"
          categoryId: support-version
          explanation: Support specialists can also reverse an erroneous refund — but they do it through the Billing Dashboard, not the Stripe API. The 5-minute window still applies.
