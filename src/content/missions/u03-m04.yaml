      docTemplate: |
        # SOP — Refund Processing — Support Specialists

        **Audience:** Support Specialists
        **Owner:** [Owner name or team]
        **Last reviewed:** 2026-05-04
        **Status:** Active

        ## Prerequisites

        Before starting, confirm:

        - [ ] [Prerequisite 1]
        - [ ] [Prerequisite 2]

        > **Stop:** If [condition], do not proceed. [What to do instead.]

        ## Steps

        1. [Step 1 — UI action in Billing Dashboard]
        2. [Step 2]
        3. [Step 3]
        4. [Step 4]
        5. [Step 5]

        > **Important:** [Any critical warning that applies to support specialists, e.g. approval threshold]

        ## Expected Outcome

        When the refund has been processed successfully:

        - [What the support specialist sees in Billing Dashboard]
        - [What the customer receives]

        ## If Something Goes Wrong

        **If the refund fails:**
        [What to do — UI-based, no engineering escalation detail]

        **If you submitted a refund in error:**
        [How to cancel it — within what time window — using what UI]
