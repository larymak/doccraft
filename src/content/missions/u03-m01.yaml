    body: |
      # API Error Budget Report — Q1 2026

      **Period:** January–March 2026
      **Prepared by:** Platform Engineering

      ## Summary

      The API error budget consumed 61% of its quarterly allocation by week 10.
      Three contributing incidents account for 78% of total budget burn.
      Current trajectory: budget exhausted by May if no corrective action is taken.

      ## Budget Burn by Service

      | Service | Budget Used | Status |
      |---------|------------|--------|
      | Checkout API | 34% | At risk |
      | Auth Service | 18% | Healthy |
      | Billing API | 9% | Healthy |

      ## Recommended Actions

      1. Freeze non-critical deploys to Checkout API until error rate stabilizes
      2. Conduct blameless review of the March 14 incident
      3. Revisit alerting thresholds for Checkout latency
  - id: doc-audience-sample-2
    filename: refund-processing-steps.md
    title: Refund Processing Steps
    trustScore: 50
    findabilityScore: 40
    issues:
      - No audience field
      - Uses internal engineering terminology (payment processor API, idempotency key) without explanation
      - Designed for support specialists but stored in the Engineering wiki
    frontmatter:
      title: Refund Processing Steps
      status: Active
      owner: Sarah Chen
      last_reviewed: "2026-02-15"
    body: |
      # Refund Processing Steps

      ## Prerequisites

      - Access to Billing Dashboard (request via #it-access)
      - Support specialist role in the customer account system

      ## Steps

      1. Open the customer account in Billing Dashboard
      2. Navigate to Transactions > Find the transaction by order ID
      3. Click "Issue Refund" — this calls the payment processor API with an idempotency key
      4. Enter the refund amount (cannot exceed original transaction amount)
      5. Select refund reason from the dropdown
      6. Add a note with the support ticket number
      7. Click Submit — the customer receives a confirmation email automatically

      ## What to Do If It Fails

      If the refund fails with error code 402, the payment processor rejected it.
      Escalate to #billing-eng with the transaction ID and error message.
