id: u03-m01
unitId: unit-03
order: 1
slug: u03-m01
title: Who Is This Actually For?
scenario: >
  The Northstar Apps wiki has grown to 90 documents with no audience labels.
  Support specialists open engineering runbooks and get lost. New hires read
  management reports and have no idea what they mean. Your manager asks you
  to tag every document with its intended audience so the team can finally
  filter and find what they need.
objectives:
  - Identify the intended audience for a document based on its content and framing
  - Distinguish between the four main internal audiences at Northstar Apps
  - Explain why audience mismatch causes knowledge debt even when docs exist
