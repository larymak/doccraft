    body: |
      # Plugin Reference

      Plugins extend Northstar Apps with external service data and actions.

      ## Available Plugin Types

      - **Data plugins** — pull metrics or records from external services
      - **Action plugins** — trigger actions in external services from Northstar workflows

      ## Installation

      Refer to the developer portal for plugin credentials and setup instructions.
