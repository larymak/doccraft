      # Connector Setup

      A connector links an external service to the Northstar Apps platform.

      ## Getting Started

      1. Go to **Settings > Connectors**.
      2. Choose a connector from the marketplace.
      3. Paste in your credentials and save.

      _Note: This page may be out of date. Check with the platform team._
