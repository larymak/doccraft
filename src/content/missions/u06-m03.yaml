id: u06-m03
unitId: unit-06
order: 3
slug: u06-m03
title: "Add Synonyms and Canonical Sources"
scenario: >
  A search audit at Northstar Apps reveals that the same concept — the process of
  connecting a third-party service to the platform — is described as "integration",
  "connector", "plugin", and "add-on" across four different documents. None of them
  link to each other and none declare themselves the canonical source. Engineers,
  PMs, and support staff each find a different document and assume it is correct.
  Your task is to designate one document as the canonical source, add synonym fields
  to all four, and cross-link them so searches for any of the four terms lead users
  to the right place.
objectives:
  - Identify when synonym fragmentation is causing search and trust problems
  - Designate a single canonical document and mark the others as non-canonical
  - Add synonym metadata so all four search terms resolve to the same canonical source
  - Add cross-reference links between the related documents
materials:
  - id: doc-integration-guide
    filename: integration-guide.md
    title: Integration Guide
    trustScore: 55
    findabilityScore: 40
    issues:
      - Does not declare itself canonical
      - No synonym field — "connector", "plugin", "add-on" searches do not surface it
      - Most complete and accurate of the four — should be canonical
    frontmatter:
      title: "Integration Guide"
      doc_type: "how-to"
      status: "active"
      owner: "platform-team"
      last_reviewed: "2026-02-01"
      next_review: "2026-08-01"
      tags:
        - integration
        - third-party
    body: |
      # Integration Guide

      This guide explains how to connect a third-party service to Northstar Apps
      using the Integrations API.

      ## Prerequisites

      - An active Northstar Apps developer account
      - API credentials for the third-party service
      - Access to the Northstar Apps dashboard

      ## Steps

      1. Navigate to **Settings > Integrations** in the dashboard.
      2. Click **Add Integration** and select your service from the catalog.
      3. Enter your API credentials in the configuration panel.
      4. Click **Test Connection** to verify the integration is live.
      5. Enable the integration and configure event routing.

      ## Troubleshooting

      If the test connection fails, verify that your API key has the correct
      permissions scopes enabled on the third-party service side.
