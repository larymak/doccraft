id: u07-m04
unitId: unit-07
order: 4
slug: u07-m04
title: "Boss: Full Docs-as-Code Workflow"
scenario: >
  The backend engineer onboarding guide has been flagged by three new hires as
  confusing and incomplete. It is missing a prerequisites section, links to a
  Confluence page new hires cannot access, and the front matter review date
  is 11 months past due. You will take this document through the full docs-as-code
  workflow: edit the content, fix the front matter, write a proper commit message,
  and complete the PR checklist before requesting a review from the docs team lead.
objectives:
  - Edit a document to fix two substantive content problems
  - Update front matter with correct status, review dates, and owner
  - Write a commit message that follows the Northstar Apps standard
  - Complete a PR checklist and demonstrate understanding of the review process
materials:
  - id: doc-backend-onboarding
    filename: onboarding/backend-engineer.md
    title: Backend Engineer Onboarding Guide
    trustScore: 38
    findabilityScore: 45
    issues:
      - Missing prerequisites section — new hires do not know what to install first
      - Confluence link on line 24 requires access new hires do not have
      - last_reviewed is 11 months overdue — next_review passed in June 2025
      - Status is still "active" but content has known accuracy gaps
    frontmatter:
      title: "Backend Engineer Onboarding Guide"
      doc_type: "tutorial"
      status: "active"
      owner: "engineering-onboarding"
      audience: "engineers"
      last_reviewed: "2025-06-01"
      next_review: "2025-12-01"
      tags:
        - onboarding
        - backend
        - engineering
    body: |
      # Backend Engineer Onboarding Guide

      Welcome to Northstar Apps. This guide will help you get your development
      environment running and make your first contribution.

      ## Setting Up Your Environment

      Clone the monorepo:

      ```bash
      git clone git@github.com:northstarapps/platform.git
      cd platform
      npm install
      ```

      Start the local stack:

      ```bash
      docker compose up -d
      ```

      For environment configuration, see the internal setup guide:
      https://northstar.atlassian.net/wiki/spaces/ENG/pages/48291

      ## Your First PR

      All changes require a pull request. Branch naming convention:
      `type/TICKET-short-description`

      Open your PR on GitHub and fill in the PR template. Request review from
      a team member before merging.

      ## Getting Help

      Post in #backend-eng on Slack. For urgent issues, ping the on-call engineer.
successCriteria:
  - Prerequisites section added with specific tool versions
  - Confluence link replaced with inline content or a link to public docs
  - Front matter last_reviewed and next_review updated to current and future dates
  - Commit message uses imperative mood and describes what changed
  - PR checklist completed with all items addressed
