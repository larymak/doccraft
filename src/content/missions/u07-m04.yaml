          feedback: Keep at least the existing tags. Add "getting-started" if the prerequisites section is new.
  - id: u07-m04-a2
    type: multiple-choice
    title: Write the Commit Message
    description: Choose the commit message that best follows the Northstar Apps standard for this change.
    xpReward: 50
    masteryThreshold: 100
    debtReduction: 5
    hints:
      - level: 1
        text: >
          The commit touches two things: added a prerequisites section and fixed a broken link.
          The best commit message covers both clearly in imperative present tense.
    data:
      question: >
        You have made two changes to the backend onboarding guide: added a prerequisites
        section with version numbers, and replaced the inaccessible Confluence link with
        inline content. Which commit message best follows the Northstar Apps standard?
      options:
        - id: a
          text: "updated backend onboarding"
          isCorrect: false
          explanation: >
            Vague and past tense. "Updated" tells the reader nothing about what
            changed or why. Every commit in a docs repo "updates" something.
        - id: b
          text: "Add prerequisites section and fix Confluence link in backend onboarding guide"
          isCorrect: true
          explanation: >
            Correct. Imperative present tense, covers both changes, names the document,
            and is specific about what changed. A reader running git log immediately
            knows what happened without opening the diff.
        - id: c
          text: "Fix backend onboarding — add prereqs, remove dead Confluence link, update dates"
          isCorrect: false
          explanation: >
            Close, but the dash-separated list format is less readable than a full sentence.
            Also "remove dead Confluence link" slightly misrepresents the action — the link
            was replaced with inline content, not just deleted.
        - id: d
          text: "Docs: onboarding improvements v2"
          isCorrect: false
          explanation: >
            "improvements v2" is meaningless in a commit message — it implies versioning
            that does not exist. It is also vague about what improved. The "Docs:" prefix
            convention is not used at Northstar Apps.
  - id: u07-m04-a3
    type: writing
    title: Edit the Document and Complete the PR Checklist
    description: >
      Write the updated version of the onboarding guide with the prerequisites section
      added and the Confluence link replaced. Then complete the PR checklist.
    xpReward: 150
    masteryThreshold: 70
    debtReduction: 12
    trustDelta: 20
    hints:
      - level: 1
        text: >
          The prerequisites section should list specific versions: Git 2.40+, Node.js 20 LTS,
          Docker Desktop 4.x. Readers install these before they can follow any other step.
      - level: 2
        text: >
          To replace the Confluence link, either inline the key information (one or two
          sentences about what the link contained) or link to the equivalent public docs page.
      - level: 3
        text: >
          The PR checklist items are: doc type is correct, owner and review date are set,
          changelog entry added, no broken links. Address each one in your checklist section.
    data:
      scenarioContext: >
        Complete the full docs-as-code workflow. Rewrite the onboarding guide with the
        two content fixes, then fill in the PR checklist below to show the change is
        ready to merge.
