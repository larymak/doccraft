          rule: equals
          value: "2026-05-04"
          feedback: Set last_reviewed to today's date (2026-05-04) since you are making changes now.
        - field: next_review
          rule: dateAfter
          value: "2026-05-04"
          feedback: next_review must be after last_reviewed. For an onboarding doc, 6 months is appropriate.
        - field: next_review
          rule: withinMonths
          value: "12"
          feedback: Onboarding docs should be reviewed at least annually — 6 months is ideal given the fast-moving stack.
        - field: status
