id: u05-m02
unitId: unit-05
order: 2
slug: u05-m02
title: Reorganize the Chaos
scenario: >
  The Northstar Apps wiki has a folder called "Misc" containing 22 documents that were
  never filed anywhere. There are also three top-level folders — "Engineering", "Support",
  and "Company" — that have grown into dumping grounds with no sub-structure. Your job
  is to propose a logical folder hierarchy and sort the documents into their correct locations.
objectives:
  - Design a logical two-level folder hierarchy for a software company wiki
  - Sort documents into the correct folder based on audience and document type
  - Identify why flat folder structures fail as documentation libraries grow
materials: []
successCriteria:
  - Folder structure sorting task score of 75 or higher
  - All documents sorted into the correct folders
  - Multiple-choice question answered correctly
estimatedMinutes: 16
prerequisiteMissionId: u05-m01
assessments:
  - id: u05-m02-a1
    type: sorting
    title: Sort Documents into the Right Folders
    description: Sort each document into the correct folder in the proposed Northstar Apps wiki hierarchy.
    xpReward: 95
    masteryThreshold: 75
    debtReduction: 8
    hints:
      - level: 1
        text: The primary sort key is audience — who reads this document as part of their normal work? The secondary sort key is document type.
      - level: 2
        text: "Runbooks, SOPs, and how-to guides are operational documents — they go under the team that executes them. ADRs and postmortems go under Engineering. Company-wide policies go under Company."
    data:
