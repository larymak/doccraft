  - id: u05-m02-a2
    type: multiple-choice
    title: Why Flat Folders Fail
    description: What is the primary reason flat folder structures break down as a wiki grows?
    xpReward: 45
    masteryThreshold: 100
    debtReduction: 4
    hints:
      - level: 1
        text: Think about what a new engineer does when they open a folder with 80 files in alphabetical order.
    data:
      question: >
        The Northstar Apps "Engineering" folder currently has 80 documents in a single flat
        list. A new backend engineer tries to find the API authentication guide and gives up
        after 3 minutes of scrolling. What is the primary problem a hierarchical structure
        solves that a flat folder cannot?
      options:
        - id: a
          text: Hierarchical folders prevent duplicate document names.
          isCorrect: false
          explanation: >
            Document naming conventions prevent duplicates, not folder structure. A flat folder
            with good naming conventions can still have unique names — it just cannot be browsed efficiently.
        - id: b
          text: >
            Hierarchical folders provide progressive narrowing — a reader can filter by team or
            function before scanning individual documents, reducing the cognitive load of browsing.
          isCorrect: true
          explanation: >
            Correct. A hierarchy lets readers navigate by audience or function first, then by topic.
            A new backend engineer opens Engineering > Backend and scans 12 documents, not 80.
            Progressive narrowing is the key benefit of hierarchy over flat structure.
        - id: c
          text: Hierarchical folders make documents easier to search by keyword.
          isCorrect: false
          explanation: >
            Full-text search works the same regardless of folder structure. Hierarchy improves
            browsability, not search relevance.
        - id: d
          text: Hierarchical folders ensure documents are kept up to date.
          isCorrect: false
          explanation: >
            Folder structure has no relationship to document freshness. An outdated doc in a
            well-organized folder is still outdated.
