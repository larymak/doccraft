        - id: eng-adrs
          label: "Engineering > ADRs"
          description: Architecture Decision Records for all technical and infrastructure decisions
        - id: eng-postmortems
          label: "Engineering > Postmortems"
          description: All incident postmortems regardless of which system was affected
        - id: support-sops
          label: "Support > SOPs"
          description: Standard operating procedures for support specialist workflows
        - id: support-runbooks
          label: "Support > Runbooks"
          description: Escalation and diagnostic runbooks for support-facing issues
        - id: support-reference
          label: "Support > Reference"
          description: Lookup docs for support — policies, limits, pricing, feature flags
        - id: company-policies
          label: "Company > Policies"
          description: Company-wide rules, legal policies, and compliance requirements
        - id: company-onboarding
          label: "Company > Onboarding"
