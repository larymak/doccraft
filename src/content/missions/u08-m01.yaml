    body: |
      # Design System Color Tokens

      All UI components must use these CSS custom properties instead of hardcoded
      hex values. This ensures automatic support for light/dark mode.

      | Token | Light Value | Dark Value |
      |-------|------------|-----------|
      | `--color-primary` | `#0052CC` | `#4C9AFF` |
      | `--color-surface` | `#FFFFFF` | `#1E1E2E` |
      | `--color-text` | `#172B4D` | `#E6E6E6` |
  - id: doc-unowned-3
