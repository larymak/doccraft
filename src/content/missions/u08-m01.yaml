    body: |
      # GDPR Data Retention Policy

      Customer PII is retained for a maximum of 36 months after account closure,
      unless a longer retention period is required by applicable law.
      Upon request, customer data is deleted within 30 days. All deletion requests
      must be logged in the compliance dashboard.
