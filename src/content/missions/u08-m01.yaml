id: u08-m01
unitId: unit-08
order: 1
slug: u08-m01
title: "Assign Owners to Unowned Documents"
scenario: >
  The Northstar Apps docs health dashboard is showing 6 documents with no owner
  assigned. No one receives review reminders for them, they are not included in
  any team's docs sprint, and two of them have content that may be out of date.
  Your task is to read each document's content and assign it to the correct team
  or role owner at Northstar Apps based on who is responsible for that subject matter.
objectives:
  - Read document content to infer the correct responsible team
  - Assign each of 6 unowned documents to the appropriate team or role owner
  - Understand the difference between the team that wrote a doc and the team that owns it
  - Recognize when shared ownership is a sign of an unclear ownership model
materials:
  - id: doc-unowned-1
    filename: payment-sla.md
    title: Payment Processing SLA
    trustScore: 50
    findabilityScore: 40
    issues:
      - No owner assigned
      - Defines uptime and response-time guarantees for the payments API
    frontmatter:
      title: "Payment Processing SLA"
      doc_type: "reference"
      status: "active"
      last_reviewed: "2025-10-01"
      next_review: "2026-04-01"
      tags:
        - payments
        - sla
        - api
    body: |
      # Payment Processing SLA

      Northstar Apps guarantees 99.95% uptime for the payments API.
      P1 incidents affecting payment processing will be responded to within 15 minutes
      and resolved within 2 hours. Scheduled maintenance windows are announced 72 hours
      in advance via the status page.
