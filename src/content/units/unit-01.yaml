bossMissionId: u01-m04
contentBlocks:
  - type: callout
    variant: warning
    content: >
      When key people leave, documentation is the only bridge between what they
      knew and what the team still needs to operate.
  - type: text
    content: >
      Knowledge debt is the accumulated cost of deferred documentation. Like
      technical debt, it compounds: the longer you wait, the worse it gets.
      In this unit, you will learn to spot it, measure it, and start reducing it.
  - type: callout
    variant: tip
    content: >
      Knowledge debt is not just about missing docs. It also shows up as stale
      docs, undiscoverable docs, unowned docs, and conflicting docs.
