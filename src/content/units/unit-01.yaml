id: unit-01
order: 1
title: Knowledge Chaos and Knowledge Debt
description: >
  Understand what knowledge debt is, how it accumulates, and why missing or
  stale documentation costs organizations time, trust, and key people.
goal: >
  Identify the five failure modes of a documentation system and calculate
  knowledge debt for a simulated team at Northstar Apps.
prerequisiteUnitId: null
tier: beginner
badge:
  id: badge-chaos-tamer
  label: Chaos Tamer
  description: Identified five categories of knowledge debt and created a recovery plan
  color: "#f1be32"
  iconSlug: chaos-tamer
  earnedCondition: Complete the Unit 1 boss mission with score >= 80
totalXP: 400
missions:
  - u01-m01
