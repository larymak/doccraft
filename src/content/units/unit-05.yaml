contentBlocks:
  - type: text
    content: >
      A naming convention is a promise. It tells readers what to expect before
      they open a file. A well-named document answers: what type is it, what
      does it cover, who uses it, and what is its current status.
  - type: example
    label: Good naming patterns
    content: |
      SOP - Refund Processing - Support - Active
      ADR-004 - Use PostgreSQL for Billing Events
      Runbook - API Error Spike - Platform
      Onboarding - Support Engineer - First 30 Days
      Postmortem - 2026-04-18 - Checkout Latency Incident
