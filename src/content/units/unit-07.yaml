contentBlocks:
  - type: text
    content: >
      Docs-as-code means documentation lives in version-controlled files
      alongside the product. Every change has a commit message, a reviewer,
      and a history. Stale docs become visible because the last commit date
      is always visible.
  - type: callout
    variant: tip
    content: >
      A good commit message for docs follows the same rules as code: present
      tense, imperative mood, explains the why not just the what.
      "Update refund SOP to reflect new 48-hour processing window" is better
      than "fixed docs" or "SOP changes."
