id: unit-07
order: 7
title: Docs-as-Code with Git and Markdown
description: >
  Use a simulated Git workflow to write, review, version, and merge documentation
  changes. Learn why treating docs like code improves quality and accountability.
goal: >
  Complete a full docs-as-code cycle: edit Markdown, write a commit message,
  open a pull request, resolve reviewer comments, and merge.
prerequisiteUnitId: unit-05
tier: advanced
