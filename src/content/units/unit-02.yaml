contentBlocks:
  - type: text
    content: >
      Different documentation needs call for different document types. A tutorial
      walks someone through a new skill. An SOP tells them exactly how to execute
      a process. A reference answers "what is this?" An explanation answers
      "why does this work this way?"
  - type: callout
    variant: info
    content: >
      The Diátaxis framework separates documentation into four quadrants: tutorials
      (learning), how-to guides (goal-oriented tasks), references (information),
      and explanations (understanding). Northstar Apps uses this plus operational
      types like SOPs, ADRs, postmortems, and changelogs.
