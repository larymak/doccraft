id: unit-03
order: 3
title: Audience, Task, and Scope
description: >
  Write documentation that the right person can actually use. Learn to define
  audience, state prerequisites, scope content clearly, and remove noise.
goal: >
  Rewrite a vague SOP for a specific audience, add prerequisites and expected
  outcomes, and remove content that does not serve the reader.
prerequisiteUnitId: unit-02
tier: intermediate
badge:
  id: badge-audience-advocate
  label: Audience Advocate
  description: Rewrote documentation to serve a specific reader clearly
  color: "#8b5cf6"
  iconSlug: audience-advocate
  earnedCondition: Complete the Unit 3 boss mission with score >= 80
totalXP: 380
missions:
  - u03-m01
