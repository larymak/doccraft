  - u03-m04
bossMissionId: u03-m04
contentBlocks:
  - type: text
    content: >
      Every document has exactly one primary reader. Before writing a single
      word, ask: who needs this? What do they already know? What do they need
      to accomplish? What could go wrong for them?
  - type: callout
    variant: tip
    content: >
      A common mistake is writing for the author instead of the reader.
      Engineers write deployment guides assuming readers know what a container
      is. Support specialists write escalation guides assuming readers know
      internal ticket systems. Always test your docs against a real reader.
