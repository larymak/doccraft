bossMissionId: u09-m04
contentBlocks:
  - type: text
    content: >
      Decision amnesia is when a team repeats the same debates because the
      original reasoning was never recorded. An Architecture Decision Record
      (ADR) captures the context, options considered, decision made, and
      expected consequences — so future teams understand why, not just what.
  - type: example
    label: ADR required fields
    content: |
      Title, Status, Date, Decision owner
      Context (why this decision was needed)
      Options considered (what was evaluated)
      Decision (what was chosen)
      Consequences (what changes as a result)
      Follow-up work, Related docs
      Supersedes / Superseded by
