id: unit-09
order: 9
title: Decision Records and Institutional Memory
description: >
  Capture architectural and operational decisions so future team members
  understand not just what was decided, but why.
goal: >
  Write an ADR from scattered meeting notes, mark a superseded decision,
  and link an ADR to its downstream SOP and architecture guide.
prerequisiteUnitId: unit-08
tier: pro
