bossMissionId: u04-m04
contentBlocks:
  - type: text
    content: >
      Templates are contracts. They tell contributors what a document needs to
      contain and remind readers what to expect. A good template reduces the
      cognitive load of writing and reviewing documentation.
  - type: callout
    variant: info
    content: >
      Required template fields: title, summary, audience, owner, backup owner,
      status, last reviewed, next review date, related docs, prerequisites,
      scope, steps or sections, validation criteria, changelog, tags, search keywords.
