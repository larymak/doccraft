id: unit-04
order: 4
title: Template Design
description: >
  Design reusable document templates that make every contributor produce
  consistent, complete, and maintainable documentation.
goal: >
  Build a runbook template, improve a weak SOP template, and explain the
  purpose of each required field.
prerequisiteUnitId: unit-02
tier: intermediate
badge:
  id: badge-template-architect
  label: Template Architect
  description: Designed templates that improved document consistency across a team
  color: "#06b6d4"
  iconSlug: template-architect
  earnedCondition: Complete the Unit 4 boss mission with score >= 80
totalXP: 400
missions:
